[package]
name = "decode-semantic"
description = "Command-line semantic code search and a stdio MCP server over decode-semantic-core."
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"

# The lints of the standalone MIT workspace these crates come from (not Decode's: no Decode-specific clippy bans).
[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
wildcard_imports = "deny"
allow_attributes_without_reason = "deny"

[lib]
name = "decode_semantic"
path = "src/lib.rs"

[[bin]]
name = "decode-semantic"
path = "src/main.rs"

[dependencies]
decode-semantic-core = { path = "../decode-semantic-core", version = "0.1.1" }
ignore = { workspace = true }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
ureq = "2"

[target.'cfg(target_os = "macos")'.dependencies]
kqueue = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
inotify = { workspace = true }

[dev-dependencies]
decode-semantic-core = { path = "../decode-semantic-core", version = "0.1.1", features = ["test-util"] }
