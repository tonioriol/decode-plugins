# Builds the rsemble engine in engine/ for every supported platform and publishes a release with
# SHA256SUMS and the licence notices. Runs on a v* tag push, or by hand to rebuild a tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
            test: true
          - target: x86_64-apple-darwin
            os: macos-15
            test: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            test: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            test: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
          } >> "$GITHUB_ENV"
      - name: Test
        if: matrix.test
        working-directory: engine
        run: cargo test --locked --release
      - name: Build
        working-directory: engine
        run: cargo build --locked --release --bin rsemble --target ${{ matrix.target }}
      - name: Stage
        run: |
          mkdir dist
          cp engine/target/${{ matrix.target }}/release/rsemble dist/rsemble-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: rsemble-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Notices
        working-directory: engine
        run: |
          cargo about generate --locked --fail about.hbs -o ../dist/THIRD-PARTY-LICENSES.txt
          cp rsemble/LICENSE ../dist/LICENSE
          cat rsemble/NOTICE > ../dist/NOTICE
      - name: Checksums
        working-directory: dist
        run: |
          chmod +x rsemble-*
          sha256sum rsemble-* LICENSE NOTICE THIRD-PARTY-LICENSES.txt > SHA256SUMS
          cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(cat engine/SOURCE)
          notes="rsemble built from engine/ at $(git rev-parse HEAD) ($source)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes "$notes"
          fi
